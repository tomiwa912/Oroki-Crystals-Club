            box-sizing: border-box;

            color: #001F54;
            background-color: #f8fdff;
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        h1, h2, h3, h4, h5 {

            font-weight: 700;
        }

            width: 90%;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        /* Header Styles */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            background-color: white;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }
        
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            transition: all 0.3s ease;
        }
        
        .logo {
            height: 45px;
            transition: all 0.3s ease;
        }
        
        .nav-desktop {
            display: flex;
            gap: 30px;
        }
        

        
        .nav-link {
            text-decoration: none;
            color: #001F54;
            font-weight: 500;
            position: relative;
            padding: 5px 0;
            transition: color 0.3s;
        }
        
        .nav-link:hover {
            color: #D4AF37;
        }
        
        .nav-link.active {
            color: #D4AF37;
        }
        
        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: #D4AF37;
            transition: width 0.3s ease;
        }
        
        .nav-link:hover::after,
        .nav-link.active::after {
            width: 100%;
        }
        
        .mobile-liquid-island {
            display: none;
        }

        @media (max-width: 768px) {
            header, .header-main {
                background: transparent !important;
                box-shadow: none !important;
                border: none !important;
                pointer-events: none;
                padding: 0 !important;
            }

            .header-container {
                display: none !important;
            }

            .mobile-liquid-island {
                display: flex;
                align-items: center;
                justify-content: space-between;
                pointer-events: auto;
                margin: 10px auto 0;
                width: calc(100% - 20px);
                max-width: 440px;
                height: 58px;
                padding: 4px 6px 4px 10px;
                background: linear-gradient(135deg, rgba(255, 255, 255, 0.78) 0%, rgba(240, 249, 255, 0.60) 50%, rgba(255, 255, 255, 0.70) 100%);
                backdrop-filter: blur(24px) saturate(190%) contrast(105%);
                -webkit-backdrop-filter: blur(24px) saturate(190%) contrast(105%);
                border-radius: 22px;
                border: 1px solid rgba(255, 255, 255, 0.8);
                box-shadow: 
                    0 12px 35px -5px rgba(0, 31, 84, 0.16),
                    0 0 0 1px rgba(255, 255, 255, 0.5) inset,
                    0 1px 2px rgba(255, 255, 255, 0.9) inset,
                    0 20px 40px -15px rgba(212, 175, 55, 0.15);
                transition: transform 0.3s ease, box-shadow 0.3s ease;
            }

            .mobile-liquid-logo {
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
                padding-right: 4px;
                transition: transform 0.2s ease;
            }

            .mobile-liquid-logo:active {
                transform: scale(0.92);
            }

            .mobile-liquid-logo img {
                height: 32px;
                width: auto;
                object-fit: contain;
            }

            .mobile-liquid-divider {
                width: 1px;
                height: 28px;
                background: linear-gradient(to bottom, transparent, rgba(0, 31, 84, 0.18), transparent);
                margin: 0 4px;
                flex-shrink: 0;
            }

            .mobile-liquid-links {
                display: flex;
                align-items: center;
                flex: 1;
                height: 100%;
                gap: 3px;
            }

            .mobile-liquid-item {
                flex: 1;
                height: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 2px;
                border-radius: 16px;
                text-decoration: none;
                color: #001F54;
                opacity: 0.72;
                transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
                -webkit-tap-highlight-color: transparent;
                user-select: none;
            }

            .mobile-liquid-item i {
                font-size: 1.05rem;
                transition: transform 0.22s ease, color 0.22s ease;
            }

            .mobile-liquid-item span {
                font-size: 0.64rem;
                font-weight: 600;
                letter-spacing: 0.02em;
                line-height: 1;
            }

            .mobile-liquid-item:active {
                transform: scale(0.92);
            }

            /* Active Tab: Glossy Liquid Pill */
            .mobile-liquid-item.active {
                opacity: 1;
                color: #ffffff;
                background: linear-gradient(135deg, #001F54 0%, #00308c 100%);
                box-shadow: 
                    0 4px 12px rgba(0, 31, 84, 0.32),
                    inset 0 1px 1px rgba(255, 255, 255, 0.45);
            }

            .mobile-liquid-item.active i {
                color: #D4AF37;
                transform: scale(1.06);
            }

            .mobile-liquid-item.active span {
                color: #ffffff;
                font-weight: 700;
            }

            .logo {
                height: 45px;
            }
        }
        
        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, #001F54 0%, #00308c 100%);
            color: white;
            text-align: center;
            padding: 140px 0 60px;
            margin-top: 60px;
        }
        
        .hero h1 {
            font-size: 2.8rem;
            margin-bottom: 20px;
        }
        
        /* Gallery Section */
        .gallery-section {
            padding: 40px 0 80px;
        }
        
        /* Masonry Grid */
        .masonry-grid {
            columns: 4;
            column-gap: 20px;
            padding: 20px 0;
        }
        
        .masonry-item {
            break-inside: avoid;
            margin-bottom: 20px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
        }
        
        .masonry-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
        }
        
        .masonry-img,
        .masonry-video {
            width: 100%;
            display: block;
            transition: transform 0.5s ease;
        }
        
        .masonry-item:hover .masonry-img,
        .masonry-item:hover .masonry-video {
            transform: scale(1.05);
        }
        
        /* Lightbox */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        
        .lightbox.open {
            opacity: 1;
            pointer-events: auto;
        }
        
        .lightbox-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
        }
        
        .lightbox-img,
        .lightbox-video {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 8px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.3);
        }
        
        .lightbox-close {
            position: absolute;
            top: -40px;
            right: 0;
            color: white;
            font-size: 2rem;
            background: none;
            border: none;
            cursor: pointer;
        }
        
        .lightbox-nav {
            position: absolute;
            top: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            transform: translateY(-50%);
            padding: 0 20px;
        }
        
        .lightbox-prev,
        .lightbox-next {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            border: none;
            transition: background 0.3s ease;
        }
        
        .lightbox-prev:hover,
        .lightbox-next:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        /* Footer */
        footer {
            background-color: #001F54;
            color: white;
            padding: 40px 0 20px;
            text-align: center;
        }
        
        .footer-logo img {
            height: 70px;
            margin-bottom: 20px;
        }
        
        .copyright {
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #aaa;
            font-size: 0.9rem;
        }
        
        /* Responsive Styles */
        @media (max-width: 1200px) {
            .masonry-grid {
                columns: 3;
            }
        }
        
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.2rem;
            }
            
            .masonry-grid {
                columns: 2;
            }
        }
        
        @media (max-width: 576px) {
            .masonry-grid {
                columns: 1;
            }
            
            .hero {
                padding: 120px 0 40px;
            }
            
            .hero h1 {
                font-size: 1.8rem;
            }
        }
        
        /* Animation Styles */
        .masonry-item {
            animation: fadeIn 0.8s ease forwards;
            opacity: 0;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Stagger animations for items */
        .masonry-item:nth-child(1) { animation-delay: 0.1s; }
        .masonry-item:nth-child(2) { animation-delay: 0.15s; }
        .masonry-item:nth-child(3) { animation-delay: 0.2s; }
        .masonry-item:nth-child(4) { animation-delay: 0.25s; }
        .masonry-item:nth-child(5) { animation-delay: 0.3s; }

        .masonry-item:nth-child(8) { animation-delay: 0.45s; }
        .masonry-item:nth-child(9) { animation-delay: 0.5s; }
        .masonry-item:nth-child(10) { animation-delay: 0.55s; }
        .masonry-item:nth-child(11) { animation-delay: 0.6s; }
        .masonry-item:nth-child(12) { animation-delay: 0.65s; }
        .masonry-item:nth-child(13) { animation-delay: 0.7s; }
        .masonry-item:nth-child(14) { animation-delay: 0.75s; }
        .masonry-item:nth-child(15) { animation-delay: 0.8s; }

        .masonry-item:nth-child(17) { animation-delay: 0.9s; }
        .masonry-item:nth-child(18) { animation-delay: 0.95s; }
        .masonry-item:nth-child(19) { animation-delay: 1s; }
        .masonry-item:nth-child(20) { animation-delay: 1.05s; }

</head>

                masonryItem.innerHTML = `
                    <video class="masonry-video" autoplay muted loop playsinline>
                        <source src="${item.video}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                `;
            } else {
                masonryItem.innerHTML = `
                    <img src="${item.image}" alt="Oroki Crystals Club Event" class="masonry-img">
                `;
            }
            masonryGrid.appendChild(masonryItem);
        });

        // Lightbox functionality
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxVideo = document.getElementById('lightboxVideo');
        const lightboxClose = document.getElementById('lightboxClose');
        const lightboxPrev = document.getElementById('lightboxPrev');
        const lightboxNext = document.getElementById('lightboxNext');
        
        let currentIndex = 0;
        
        // Open lightbox
        document.querySelectorAll('.masonry-item').forEach((item, index) => {
            item.addEventListener('click', () => {
                currentIndex = index;
                updateLightbox();
                lightbox.classList.add('open');
                document.body.style.overflow = 'hidden';
            });
        });
        
        // Close lightbox
        function closeLightbox() {
            lightbox.classList.remove('open');
            document.body.style.overflow = 'auto';
            lightboxVideo.pause();
            lightboxVideo.src = "";
        }
        
        lightboxClose.addEventListener('click', closeLightbox);
        
        // Navigate lightbox
        lightboxPrev.addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + galleryItems.length) % galleryItems.length;
            updateLightbox();
        });
        
        lightboxNext.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % galleryItems.length;
            updateLightbox();
        });
        
        // Update lightbox content
        function updateLightbox() {
            const item = galleryItems[currentIndex];
            // Pause and clear any playing video first
            lightboxVideo.pause();
            lightboxVideo.src = "";
            
            if (item.type === 'video') {
                lightboxImg.style.display = 'none';
                lightboxVideo.style.display = 'block';
                lightboxVideo.src = item.video;
                lightboxVideo.load();
                lightboxVideo.play().catch(err => console.log("Lightbox autoplay blocked/failed: ", err));
            } else {
                lightboxVideo.style.display = 'none';
                lightboxImg.style.display = 'block';
                lightboxImg.src = item.image;
            }
        }
        
        // Close lightbox when clicking outside
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                closeLightbox();
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (lightbox.classList.contains('open')) {
                if (e.key === 'Escape') {
                    closeLightbox();
                } else if (e.key === 'ArrowLeft') {
                    currentIndex = (currentIndex - 1 + galleryItems.length) % galleryItems.length;
                    updateLightbox();
                } else if (e.key === 'ArrowRight') {
                    currentIndex = (currentIndex + 1) % galleryItems.length;
                    updateLightbox();
                }
            }
        });

        // Header scroll effect (desktop only)
        window.addEventListener('scroll', function() {
            if (window.innerWidth <= 768) return;
            const header = document.querySelector('header');
            const headerContainer = document.querySelector('.header-container');
            const logo = document.querySelector('.header-container .logo');
            if (!header || !headerContainer) return;
            const currentScroll = window.pageYOffset;

            if (currentScroll > 100) {
                headerContainer.style.padding = '5px 0';
                header.style.boxShadow = '0 2px 15px rgba(0, 0, 0, 0.1)';
                if (logo) logo.style.height = '35px';
            } else {
                headerContainer.style.padding = '8px 0';
                header.style.boxShadow = '0 2px 15px rgba(0, 0, 0, 0.1)';
                if (logo) logo.style.height = '45px';
            }
        });

        // Simplified GSAP Animations
        window.addEventListener('DOMContentLoaded', function() {
            // Simple fade-in for hero title
            gsap.from('.hero h1', {
                opacity: 0,
                duration: 1,
                ease: 'power2.out'
            });

            // Simple fade-in for gallery section
            gsap.from('.gallery-section', {
                opacity: 0,
                duration: 1,
                ease: 'power2.out'
            });

            // Simple fade-in for gallery items
            gsap.from('.masonry-item', {
                opacity: 0,
                duration: 1,
                stagger: 0.1,
                ease: 'power2.out'
            });
        });
    </script>
</body>
</html>
